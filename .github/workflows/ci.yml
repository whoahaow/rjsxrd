name: CI

# Quality gate for the Python pipeline: format, lint, tests and the dependency
# audit are blocking. Deliberately separate from frequent_update.yml — that
# workflow runs the pipeline, this one only verifies the code.

on:
  push:
  pull_request:

# Supersede an in-flight run when a new commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29  # v4.1.6

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true

      - name: Install development dependencies
        # No [project] table yet, so `uv run` is unavailable: create the virtual
        # environment explicitly and install the dev manifest into it.
        run: |
          uv venv --python 3.12
          cd source && uv pip install --python ../.venv/bin/python -r requirements-dev.txt

      - name: Format check
        run: .venv/bin/ruff format --check .

      - name: Type check
        # Whole-tree, not a ratchet. The path list this step used to carry
        # existed to migrate a residual that is gone, and a list is the weaker
        # gate by construction: it covers the files on it and cannot see a
        # module that is not. The proof is reproducible — at the revision the
        # burn-down started from (60a69368) the 27-module list exited 0
        # ("Success: no issues found in 27 source files") while `mypy .`
        # reported 87 errors in 22 files.
        #
        # `--follow-imports=silent` is gone with the list: it was there so a
        # listed module was judged on its own code instead of inheriting the
        # residual of everything it imports. With no residual left to inherit,
        # the tree is judged as one program, which is what the gate is for.
        #
        # `strict`, `disallow_untyped_defs` and `check_untyped_defs` stay off —
        # see [tool.mypy]: each multiplies the error count instead of revealing
        # new defects, so they are tracked separately.
        run: |
          cd source
          ../.venv/bin/python -m mypy .

      - name: Tests
        # Coverage is folded into this run and gated. The mode, the floor and
        # the exclusions live in [tool.coverage] in pyproject.toml — and
        # --cov-config is what makes them count: pytest-cov defaults to a
        # `.coveragerc` resolved in the invocation directory, which here is
        # source/, so without the flag the section is read by nothing and the
        # gate degrades to a report.
        run: |
          cd source
          ../.venv/bin/python -m pytest --cov=. --cov-report=term-missing -q \
            --cov-config=../pyproject.toml

      - name: Dependency audit
        run: .venv/bin/pip-audit -r source/requirements-dev.txt

      - name: Lint
        # Blocking, like every step above it. The 40 findings this step was made
        # non-blocking for are fixed at the source rather than silenced: no
        # `noqa`, no per-file ignore, no rule added to the `ignore` list in
        # pyproject.toml. A finding here is a defect to fix or a rule to justify
        # in the open, never something to suppress.
        run: .venv/bin/ruff check .
