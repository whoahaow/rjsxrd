name: CI

# Quality gate for the Python pipeline: format, tests and the dependency audit
# are blocking. Deliberately separate from frequent_update.yml — that workflow
# runs the pipeline, this one only verifies the code.

on:
  push:
  pull_request:

# Supersede an in-flight run when a new commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29  # v4.1.6

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true

      - name: Install development dependencies
        # No [project] table yet, so `uv run` is unavailable: create the virtual
        # environment explicitly and install the dev manifest into it.
        run: |
          uv venv --python 3.12
          cd source && uv pip install --python ../.venv/bin/python -r requirements-dev.txt

      - name: Format check
        run: .venv/bin/ruff format --check .

      - name: Type check (ratchet)
        # Blocking, and deliberately narrow. Every module listed here is at zero
        # type errors; the list may only grow. `--follow-imports=silent` keeps
        # the check scoped to the listed files, so a module can join the list
        # without inheriting the residual of everything it imports.
        #
        # Residual measured after the last extension: 0 errors in 88 source
        # files. The 87-error residual this list used to sit beside is fully
        # burned down — 37 assignment, 19 arg-type, 17 var-annotated,
        # 13 no-any-return, 1 return-value — and every module that carried it
        # joined the list, as did the test module that carried the five
        # annotation-unchecked notes. Appended below the original 27 entries,
        # in the same order.
        #
        # The four `cast()`s in utils/ip_verifier.py, which used to launder
        # untyped response fields into a declared `str | None`, are now real
        # isinstance narrowing. No `# type: ignore` was added to reach zero.
        run: |
          cd source
          ../.venv/bin/python -m mypy --follow-imports=silent \
            config/settings.py \
            fetchers/daily_repo_fetcher.py \
            fetchers/sstap_scraper.py \
            fetchers/telegram_proxy_scraper.py \
            fetchers/upstream_aggregator.py \
            fetchers/yaml_converter.py \
            scripts/benchmark_configs.py \
            scripts/purge_dead_urls.py \
            scripts/test_telegram_proxies.py \
            utils/_sni_worker.py \
            utils/config_helpers.py \
            utils/config_tagger.py \
            utils/curl_import.py \
            utils/file_utils.py \
            utils/git_updater.py \
            utils/ip_verifier.py \
            utils/managed_process.py \
            utils/process_registry.py \
            utils/progress.py \
            utils/proxy_monitor.py \
            utils/psutil_available.py \
            utils/resource_monitor.py \
            utils/security_filter.py \
            utils/smart_eta.py \
            utils/system_specs.py \
            utils/telegram_notifier.py \
            utils/vpn_config.py \
            main.py \
            fetchers/fetcher.py \
            processors/config_processor.py \
            processors/telegram_proxy_processor.py \
            scripts/analyze_url_stats.py \
            scripts/purge_stale_urls.py \
            tests/test_config_processor.py \
            utils/bypass_builder.py \
            utils/download_xray.py \
            utils/executor_cache.py \
            utils/file_writer.py \
            utils/git_auto_cleaner.py \
            utils/github_handler.py \
            utils/health_check.py \
            utils/logger.py \
            utils/protocol_parsers.py \
            utils/proxy_detector.py \
            utils/simple_tester.py \
            utils/telegram_proxy_verifier.py \
            utils/url_stats.py \
            utils/xray_batch.py \
            utils/xray_helpers.py \
            utils/xray_tester.py

      - name: Tests
        # Coverage is folded into this run and reported, not gated: the
        # threshold is a later card's ratchet.
        run: |
          cd source
          ../.venv/bin/python -m pytest --cov=. --cov-report=term-missing -q

      - name: Dependency audit
        run: .venv/bin/pip-audit -r source/requirements-dev.txt

      - name: Lint
        # Non-blocking: 40 known findings, all in the test files (card K14).
        # Visible now, gating once that card lands.
        continue-on-error: true
        run: .venv/bin/ruff check .
