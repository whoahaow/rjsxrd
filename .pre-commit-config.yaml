# Directories holding generated or mirrored product output. Their content is
# published as-is, so no hook may rewrite it; pyproject.toml lists the same
# three paths in [tool.ruff] extend-exclude.
exclude: ^(githubmirror|qr-codes|source/xray)/

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        # Generated config artifacts in this repository legitimately reach
        # 100-200 KB, so the guard sits well above the usual 512 KB limit.
        args: ['--maxkb=2048']
