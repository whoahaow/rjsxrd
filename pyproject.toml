[tool.ruff]
line-length = 100
target-version = "py311"
src = ["source"]
extend-exclude = ["githubmirror", "qr-codes", "source/xray"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4", "RET", "PIE", "PERF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"source/scripts/*.py" = ["I"]  # scripts handle imports independently
"source/tests/*" = ["ARG", "S101"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true
# The first-party import root, named so the answer does not depend on where you
# stand. `explicit_package_bases` makes the working directory a package base,
# and this file is read from two of them: the CI step runs `cd source && mypy .`,
# where `utils`, `fetchers` and `processors` resolve because they sit under the
# working directory — and `mypy .` from the repository root, where they do not,
# silently become `Any` (via `ignore_missing_imports` below) and raise 14
# `[no-any-return]` errors over the same 90 files. Pinning the root here makes
# both invocations judge the same program instead of one of them judging
# unresolved names. An entry that does not exist from a given directory is
# simply a base that contributes nothing, so the `source/` invocation is
# unaffected by it.
mypy_path = "source"
# Staged tightening, not a finished configuration. `strict`,
# `disallow_untyped_defs` and `check_untyped_defs` are deliberately NOT set:
# each one multiplies the error count instead of revealing new defects, so they
# are tracked separately from the ratchet below.
show_error_codes = true
# A `# type: ignore` that no longer suppresses anything is a stale claim about
# the code. Turning this on makes them visible so they get deleted.
warn_unused_ignores = true

[tool.coverage.run]
# Branch coverage, not statements alone: a statement executed once still hides
# the arm of an `if` that never ran, and that is where this pipeline's crashes
# have lived (an unbound local, an upload arm that evaporated under `-O`).
# The measured tree is the directory pytest runs in — `source/`, in both the
# documented local command and the CI step, which pass `--cov=.`. A literal
# `source = "source/"` would resolve to nothing from inside `source/`, and a
# hand-written package list would be a list a new package can fall off.
branch = true

# The test suite is not measured. It used to be — `--cov=.` from `source/` counted the
# tests as code — and at the time this changed they were 6556 of the tree's 14234
# statements, covered at 98 % against the code's 57 %. The published percentage was
# therefore mostly a statement about the suite, and every change to the suite
# moved the rows the documentation states: they went stale three times for exactly that
# reason. Measuring the code the suite exists for makes the number say what the page
# implies, and takes the suite's churn out of the denominator entirely. The floor below
# is re-derived from this scope rather than carried over — the two are different
# denominators and only look comparable.
omit = ["tests/*"]

[tool.coverage.report]
# The floor, not the measured value. It is stated for the scope the `omit` above
# defines: the project's code, with the test suite not measured.
#
# 53 is the offline floor — `-m "not integration"`, which deselects the 15 network tests
# and the coverage those tests alone provide — less the four points this floor has
# always been set under that measurement. That run prints 56.76 % over 7635 statements,
# 3082 missed and 2520 branches; the full run of the same scope prints 56.95 %. Rounding
# the floor to a whole number leaves 3.76 points between it and the offline measurement.
# The record states 56.87 % for the same quantity on the tree of that time, which held
# 7678 statements: the difference is the dead typed layer removed from
# utils/url_stats.py, not a re-derivation of the floor. On the tree at `5dad902f` the
# same run prints 56.89 % over 7653 statements and 3081 missed, which leaves 3.89 points;
# the floor stays 53, because the four-point offset it is derived with is what moved, not
# the rule.
#
# What those 3.76 points are for. Run-to-run variance, first: the 15 network-marked
# tests execute a different amount of code per invocation, so the full-run figure moves
# by about a tenth of a point — testing.md states the spread, and the offline floor
# deselects those tests and does not move with it. And the runner, second: CI is Linux,
# where the number has never been observed, so the floor is held under a measurement
# taken on Windows.
#
# It is not held for the `sys.platform` branches, and that was this comment's previous
# error: the two sides of each branch swap one for one (what Linux would cover is what
# Windows covers instead), and the only block that exists on the non-Windows side alone
# — utils/download_xray.py:334-338, the `os.chmod` — is reached by the suite on neither
# platform. At most ~2 statements of the measured 7635, ~0.03 of a point, which is what
# the comment here used to offer as the reason for a 3.9-point gap.
#
# It is a tightening over the 65 it replaces, and the raw headroom understates by how
# much. 65 stood over a tree in which the suite was measured covering itself at 98 %, so
# the same run read 73.56 % for the tree while the code the tests exist for read
# 56.94 %; one point of that tree is 14192/7636 of a point of code, so the 8.56 points
# of apparent headroom were ~15.9 points of code coverage, against 3.89 now.
fail_under = 53
exclude_also = [
    # An abstract method body cannot be reached by construction; the subclass
    # that implements it is what the tests drive.
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["source/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    # Every registered marker has to be carried by at least one test: an entry
    # nothing uses is a claim about the suite that is not true, and
    # `tests/test_docs_figures.py` fails the run when one appears. `slow` was
    # registered and used by zero tests, so it is gone.
    "integration: marks tests as integration tests (require network/external services)",
    "unit: marks tests as unit tests (pure logic, no external dependencies)",
]
filterwarnings = [
    # No category-wide ignores. A first-party DeprecationWarning is the early
    # signal for the next dependency bump, and `ignore::ResourceWarning` hid
    # unclosed files in these tests. If a third-party library ever needs a
    # filter, scope it to that module ("ignore::DeprecationWarning:<module>.*")
    # instead of silencing the category.
    "default::ResourceWarning",
]
